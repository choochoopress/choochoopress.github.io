<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Choo Choo Press</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans&display=swap" rel="stylesheet">
</head>

<body>

    <header>
        <h1><a href="index.html">CHOO CHOO PRESS</a></h1>
        <div class="icons">
            <a href="https://www.instagram.com/choochoopress/" target="_blank"><img class="camera" src="assets/insta-09.svg"></a>
            <a href="mailto:choochoopress@gmail.com"><img class="letter" src="assets/mail-10.svg"></a>
        </div>
    </header>

    <section class="books">
        <div class="arrow"><a href="index.html">&leftarrow;</a>
        </div>

        <div class="book-specs">
            <h2>{{ page.title }}<br>by {{ page.author }}</h2>
            <h3>${{ page.price }}</h3>
            <a href="{{ page.shop_url }}"><div id="shop">Shop</div></a>
            <ul class="spec-list">
                {% for spec in page.specs %}
                <li>{{ spec }}</li>
                {% endfor %}
            </ul>
        </div>

        <div class="sku">
            <h4>{{ page.blurb }}</h4>
            <h4>{{ page.description }}</h4>
            <a href="{{ page.shop_url }}"><div id="shop">Shop</div></a>
        </div>

        <div class="book-images">
            {% for image in page.images %}
            <img src="{{ image }}" alt="{{ page.title }}">
            {% endfor %}
        </div>
    </section>

</body>
</html>
